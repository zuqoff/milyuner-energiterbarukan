<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Energi Terbarukan - Millionaire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #001233 0%, #000000 100%);
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Hexagonal Button Style for Questions/Answers */
        .mil-btn {
            position: relative;
            background: linear-gradient(180deg, #000814 0%, #000000 100%);
            border: 2px solid #00e5ff;
            border-radius: 50px;
            color: white;
            padding: 15px 30px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3), inset 0 0 10px rgba(0, 229, 255, 0.2);
            display: flex;
            align-items: center;
        }

        .mil-btn:hover:not(:disabled) {
            background: linear-gradient(180deg, #002244 0%, #000000 100%);
            border-color: #00ffff;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.7), inset 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .mil-btn.selected {
            background: linear-gradient(180deg, #f57f17 0%, #fbc02d 100%);
            border-color: #fff;
            color: black;
            animation: pulse-yellow 0.5s infinite alternate;
        }

        .mil-btn.correct {
            background: linear-gradient(180deg, #1b5e20 0%, #2e7d32 100%);
            border-color: #a5d6a7;
            color: white;
            animation: pulse-green 0.5s 6 alternate;
        }

        .mil-btn.wrong {
            background: linear-gradient(180deg, #b71c1c 0%, #c62828 100%);
            border-color: #ef9a9a;
            color: white;
        }

        .mil-btn.disabled {
            opacity: 0;
            pointer-events: none;
        }

        .option-letter {
            color: #ffca28;
            font-weight: bold;
            margin-right: 15px;
            font-size: 1.2rem;
        }

        .mil-btn.selected .option-letter, .mil-btn.correct .option-letter, .mil-btn.wrong .option-letter {
            color: inherit;
        }

        /* Prize Ladder */
        .prize-item {
            padding: 5px 15px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #ffb300;
        }
        .prize-item.active {
            background-color: #ff9800;
            color: black;
        }
        .prize-item.safe {
            color: white;
        }
        .prize-item.passed {
            color: #9e9e9e;
        }

        /* Animations */
        @keyframes pulse-yellow {
            from { box-shadow: 0 0 10px #fbc02d; }
            to { box-shadow: 0 0 20px #fff59d; }
        }
        @keyframes pulse-green {
            from { box-shadow: 0 0 10px #4caf50; }
            to { box-shadow: 0 0 30px #a5d6a7; }
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fade-in 0.5s ease-out forwards;
        }

        /* Lifelines */
        .lifeline-btn {
            width: 60px;
            height: 40px;
            border-radius: 20px;
            background: radial-gradient(circle, #001233, #000);
            border: 2px solid #00e5ff;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .lifeline-btn:hover {
            border-color: #00ffff;
            color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.7);
        }
        .lifeline-btn.used {
            opacity: 0.3;
            text-decoration: line-through;
            pointer-events: none;
            color: red;
        }

        /* Custom Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        .modal-content {
            background: linear-gradient(180deg, #001233, #000);
            border: 2px solid #00e5ff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.5);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        /* Chart */
        .bar-container { display: flex; align-items: flex-end; justify-content: space-around; height: 150px; margin-top: 20px; border-bottom: 2px solid white; padding-bottom: 5px; }
        .bar-wrapper { display: flex; flex-direction: column; align-items: center; width: 20%; }
        .bar { width: 100%; background: #00e5ff; transition: height 1s ease-out; border-radius: 3px 3px 0 0; box-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
        .bar-label { margin-top: 5px; font-weight: bold; }
        .bar-percent { margin-bottom: 5px; font-size: 0.8rem; }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

    <!-- Screen 1: Welcome -->
    <div id="welcome-screen" class="w-full max-w-2xl px-6 flex flex-col items-center justify-center min-h-screen text-center animate-fade">
        <h1 class="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-4 drop-shadow-lg">
            KUIS ENERGI TERBARUKAN
        </h1>
        <p class="text-lg md:text-xl text-[#00e5ff] mb-8">Edisi Who Wants to Be a Millionaire - Fisika</p>
        
        <div class="bg-black/70 p-8 rounded-2xl border-2 border-[#00e5ff] w-full shadow-[0_0_20px_rgba(0,229,255,0.4)]">
            <label for="playerName" class="block text-xl mb-4 text-gray-300">Masukkan Nama Anda:</label>
            <input type="text" id="playerName" class="w-full text-center p-3 rounded-full bg-[#001233]/50 border-2 border-[#00e5ff] text-white text-xl focus:outline-none focus:border-[#00ffff] focus:shadow-[0_0_15px_rgba(0,255,255,0.5)] mb-6 transition-all" placeholder="Nama Peserta...">
            
            <button onclick="startGame()" class="w-full py-3 rounded-full bg-gradient-to-r from-yellow-500 to-yellow-700 hover:from-yellow-400 hover:to-yellow-600 text-black font-bold text-xl uppercase tracking-wider transition-all transform hover:scale-105 shadow-[0_0_15px_rgba(255,215,0,0.5)]">
                Mulai Permainan
            </button>
        </div>
    </div>

    <!-- Screen 2: Game -->
    <div id="game-screen" class="hidden w-full max-w-7xl mx-auto p-4 flex-col lg:flex-row gap-6 min-h-screen justify-center items-center">
        
        <!-- Left Side: Main Game Area -->
        <div class="flex-1 flex flex-col items-center justify-center w-full">
            
            <!-- Header: Lifelines & Name -->
            <div class="w-full max-w-4xl flex justify-between items-center mb-6 px-4">
                <div class="text-xl text-yellow-400 font-bold" id="display-name">Player</div>
                <div class="flex gap-4">
                    <button id="ll-5050" class="lifeline-btn" onclick="useLifeline('5050')" title="50:50">50:50</button>
                    <button id="ll-phone" class="lifeline-btn" onclick="useLifeline('phone')" title="Phone a Friend">☎</button>
                    <button id="ll-audience" class="lifeline-btn" onclick="useLifeline('audience')" title="Ask the Audience">👥</button>
                </div>
            </div>

            <!-- Question Box -->
            <div class="w-full max-w-4xl mb-8 animate-fade">
                <div class="bg-gradient-to-b from-[#001233] to-black border-2 border-[#00e5ff] rounded-3xl p-6 text-center shadow-[0_0_20px_rgba(0,229,255,0.5)]">
                    <span id="question-number" class="text-yellow-500 font-bold text-sm block mb-2">Pertanyaan 1 untuk Rp 50.000</span>
                    <h2 id="question-text" class="text-xl md:text-2xl font-semibold leading-relaxed">Memuat pertanyaan...</h2>
                </div>
            </div>

            <!-- Options Grid -->
            <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-4 animate-fade">
                <button id="btn-0" class="mil-btn group" onclick="selectAnswer(0)">
                    <span class="option-letter">A:</span> <span id="opt-0">Pilihan A</span>
                </button>
                <button id="btn-1" class="mil-btn group" onclick="selectAnswer(1)">
                    <span class="option-letter">B:</span> <span id="opt-1">Pilihan B</span>
                </button>
                <button id="btn-2" class="mil-btn group" onclick="selectAnswer(2)">
                    <span class="option-letter">C:</span> <span id="opt-2">Pilihan C</span>
                </button>
                <button id="btn-3" class="mil-btn group" onclick="selectAnswer(3)">
                    <span class="option-letter">D:</span> <span id="opt-3">Pilihan D</span>
                </button>
            </div>
            
            <!-- Walk Away Button -->
            <div class="mt-8">
                <button onclick="confirmWalkAway()" class="text-gray-400 hover:text-white underline text-sm">Berhenti dan bawa pulang uang saat ini</button>
            </div>
        </div>

        <!-- Right Side: Prize Ladder -->
        <div class="w-full lg:w-80 bg-black/80 border-2 border-[#00e5ff] rounded-xl p-4 shadow-[0_0_15px_rgba(0,229,255,0.3)] hidden md:block">
            <h3 class="text-center text-gray-400 font-bold mb-4 border-b border-gray-600 pb-2">Tingkat Hadiah</h3>
            <div id="prize-list" class="flex flex-col-reverse space-y-1 space-y-reverse">
                <!-- Generates dynamically -->
            </div>
        </div>
    </div>

    <!-- Custom Modals -->
    <div id="custom-modal" class="modal-overlay hidden">
        <div class="modal-content animate-fade">
            <h2 id="modal-title" class="text-2xl font-bold text-yellow-400 mb-4">Pesan</h2>
            <div id="modal-body" class="text-lg text-white mb-6">Isi pesan...</div>
            <button id="modal-close-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-full" onclick="closeModal()">Tutup</button>
        </div>
    </div>

    <script>
        // --- 1. Bank Soal (100 Soal Fisika Energi Terbarukan) ---
        // Topik: PLTA (Air), PLTS (Surya), PLTB (Angin), PLTP (Panas Bumi), Biogas/Biomassa
        // Kesulitan: 1 (Mudah), 2 (Sedang), 3 (Sulit)
        const bankSoal = [
            // PLTA - Mudah
            {q: "Apa singkatan dari PLTA?", options: ["Pembangkit Listrik Tenaga Alam", "Pembangkit Listrik Tenaga Angin", "Pembangkit Listrik Tenaga Air", "Pusat Listrik Tenaga Api"], answer: 2, diff: 1},
            {q: "Sumber energi utama pada PLTA adalah...", options: ["Angin", "Gerak air", "Panas matahari", "Batu bara"], answer: 1, diff: 1},
            {q: "Energi yang dimiliki air karena ketinggiannya di bendungan disebut energi...", options: ["Kinetik", "Potensial", "Mekanik", "Kalor"], answer: 1, diff: 1},
            {q: "Fungsi utama bendungan (waduk) pada sistem PLTA adalah...", options: ["Menyaring kotoran", "Menampung air untuk menciptakan beda tinggi", "Mendinginkan generator", "Menjadi tempat wisata air"], answer: 1, diff: 1},
            {q: "Alat yang berputar saat terkena aliran air pada PLTA disebut...", options: ["Generator", "Turbin", "Transformator", "Kondensor"], answer: 1, diff: 1},
            {q: "Air yang mengalir menuruni pipa pesat mengalami perubahan energi...", options: ["Kinetik ke Potensial", "Potensial ke Kinetik", "Mekanik ke Listrik", "Listrik ke Mekanik"], answer: 1, diff: 1},
            // PLTA - Sedang
            {q: "Pipa yang mengalirkan air dari waduk menuju turbin dinamakan...", options: ["Draft tube", "Surge tank", "Penstock", "Tailrace"], answer: 2, diff: 2},
            {q: "Komponen yang mengubah energi mekanik putaran turbin menjadi energi listrik adalah...", options: ["Inverter", "Generator", "Transformator", "Kapasitor"], answer: 1, diff: 2},
            {q: "Hukum fisika yang mendasari kerja generator pada PLTA adalah hukum...", options: ["Newton", "Termodinamika", "Faraday (Induksi Elektromagnetik)", "Archimedes"], answer: 2, diff: 2},
            {q: "Beda tinggi (jarak vertikal) antara permukaan air di waduk dengan turbin disebut...", options: ["Flow rate", "Head", "Debit", "Pressure"], answer: 1, diff: 2},
            {q: "Jika debit air (Q) dan ketinggian (h) diperbesar, maka daya listrik yang dihasilkan PLTA akan...", options: ["Menurun", "Tetap", "Berfluktuasi", "Meningkat"], answer: 3, diff: 2},
            {q: "Turbin yang cocok digunakan untuk PLTA dengan 'Head' sangat tinggi adalah turbin...", options: ["Kaplan", "Francis", "Pelton", "Crossflow"], answer: 2, diff: 2},
            {q: "Daya listrik PLTA dirumuskan dengan P = ρ.g.Q.h.η. Simbol ρ (rho) mewakili...", options: ["Percepatan gravitasi", "Massa jenis air", "Efisiensi sistem", "Debit air"], answer: 1, diff: 2},
            // PLTA - Sulit
            {q: "Fungsi dari Surge Tank (Tangki Pendatar) pada sistem PLTA adalah...", options: ["Menyaring sampah", "Meredam efek water hammer (palu air) di penstock", "Mendinginkan suhu air", "Menambah tekanan air masuk"], answer: 1, diff: 3},
            {q: "Turbin Francis dan Kaplan termasuk dalam kategori turbin...", options: ["Impuls", "Reaksi", "Kinetik murni", "Termal"], answer: 1, diff: 3},
            {q: "Energi kinetik rotasi turbin dikonversi menjadi listrik melalui perubahan fluks magnetik. Besarnya GGL induksi sebanding dengan...", options: ["Hambatan kawat", "Suhu kumparan", "Laju perubahan fluks magnetik", "Warna medan magnet"], answer: 2, diff: 3},
            {q: "Draft tube (pipa lepas) pada instalasi PLTA dipasang pada bagian...", options: ["Sebelum penstock", "Keluaran turbin reaksi menuju tailrace", "Di atas bendungan", "Keluaran generator"], answer: 1, diff: 3},
            {q: "Berapa kira-kira efisiensi rata-rata dari PLTA skala besar secara keseluruhan (air ke listrik)?", options: ["20-30%", "40-50%", "60-70%", "80-90%"], answer: 3, diff: 3},
            {q: "PLTA run-of-the-river berbeda dengan PLTA konvensional karena...", options: ["Tidak membutuhkan generator", "Menggunakan air laut", "Tidak memiliki waduk penampungan besar (bendungan)", "Menggunakan turbin uap"], answer: 2, diff: 3},
            {q: "Pada ketinggian head statis 100m, tekanan air di bagian bawah penstock tanpa aliran mendekati...", options: ["1 atm", "5 atm", "10 atm", "100 atm"], answer: 2, diff: 3},

            // PLTS - Mudah
            {q: "Sumber utama pada Pembangkit Listrik Tenaga Surya adalah...", options: ["Cahaya Bulan", "Angin", "Radiasi Matahari", "Panas Bumi"], answer: 2, diff: 1},
            {q: "Panel yang menangkap cahaya matahari dan mengubahnya menjadi listrik disebut...", options: ["Panel Termal", "Panel Surya (Solar Cell)", "Kolektor Surya", "Panel Kinetik"], answer: 1, diff: 1},
            {q: "Arus listrik yang dihasilkan langsung oleh sel surya adalah arus...", options: ["AC (Bolak-balik)", "DC (Searah)", "Campuran", "Statis"], answer: 1, diff: 1},
            {q: "Untuk menyimpan energi listrik dari PLTS agar bisa digunakan malam hari, kita membutuhkan...", options: ["Baterai (Aki)", "Inverter", "Generator", "Transformator"], answer: 0, diff: 1},
            {q: "Cuaca yang paling ideal agar PLTS menghasilkan daya maksimal adalah...", options: ["Mendung", "Hujan deras", "Cerah tanpa awan", "Berkabut"], answer: 2, diff: 1},
            {q: "Bahan semikonduktor yang paling banyak digunakan untuk membuat sel surya saat ini adalah...", options: ["Besi", "Tembaga", "Silikon", "Aluminium"], answer: 2, diff: 1},
            // PLTS - Sedang
            {q: "Proses perubahan energi cahaya menjadi energi listrik pada material semikonduktor disebut efek...", options: ["Termoelektrik", "Fotovoltaik", "Piezoelektrik", "Fotolistrik Einstein"], answer: 1, diff: 2},
            {q: "Alat yang bertugas mengubah arus DC dari panel surya menjadi arus AC untuk alat rumah tangga adalah...", options: ["Solar Charge Controller", "Inverter", "Konverter", "Adaptor"], answer: 1, diff: 2},
            {q: "Solar Charge Controller (SCC) berfungsi untuk...", options: ["Mengubah tegangan AC ke DC", "Mengatur arus masuk/keluar ke baterai agar tidak overcharge", "Meningkatkan daya panel surya", "Menangkap lebih banyak cahaya"], answer: 1, diff: 2},
            {q: "Satuan untuk menyatakan daya puncak (maksimal) yang dihasilkan panel surya adalah...", options: ["Joule (J)", "Watt-peak (Wp)", "Volt (V)", "Ampere (A)"], answer: 1, diff: 2},
            {q: "Tipe panel surya yang terbuat dari satu kristal silikon murni dan memiliki efisiensi tertinggi disebut...", options: ["Polikristalin", "Monokristalin", "Thin Film", "Amorphous"], answer: 1, diff: 2},
            {q: "Apa fungsi dari dioda bypass pada modul surya?", options: ["Menambah tegangan", "Mengubah arus", "Mencegah hot spot saat panel tertutup bayangan (shading)", "Menyimpan energi"], answer: 2, diff: 2},
            {q: "Jika 4 panel surya 100Wp, 12V dirangkai seri, maka total tegangannya menjadi...", options: ["12V", "24V", "48V", "100V"], answer: 2, diff: 2},
            // PLTS - Sulit
            {q: "Partikel elementer cahaya yang membawa energi dan menumbuk elektron pada sel surya disebut...", options: ["Proton", "Neutron", "Foton", "Bozon"], answer: 2, diff: 3},
            {q: "Energi minimum yang dibutuhkan elektron untuk melompat dari pita valensi ke pita konduksi pada silikon disebut...", options: ["Energi Ionisasi", "Work Function", "Bandgap (Celah Pita)", "Energi Kinetik"], answer: 2, diff: 3},
            {q: "Sel surya tipe N (N-type) didoping dengan elemen p-blok yang memiliki 5 elektron valensi, contohnya...", options: ["Boron", "Fosfor", "Aluminium", "Galium"], answer: 1, diff: 3},
            {q: "Untuk PLTS On-Grid, komponen apa yang sinkronisasi fase arus AC panel surya dengan jaringan PLN?", options: ["Grid Tie Inverter", "Battery Bank", "MPPT Controller", "Isolator"], answer: 0, diff: 3},
            {q: "Teknologi MPPT (Maximum Power Point Tracking) pada SCC bekerja dengan cara...", options: ["Memutus arus jika penuh", "Mencari titik kombinasi tegangan dan arus (V x I) maksimum", "Menurunkan suhu panel", "Mengubah arah hadap panel"], answer: 1, diff: 3},
            {q: "Lapisan tipis (Thin Film) panel surya seperti CIGS menggunakan material dasar...", options: ["Cadmium Telluride", "Copper Indium Gallium Selenide", "Amorphous Silicon", "Perovskite"], answer: 1, diff: 3},
            {q: "Sudut kemiringan panel surya (tilt angle) ideal di khatulistiwa (seperti di Indonesia) sebaiknya...", options: ["Tegak lurus 90 derajat", "Hampir datar (10-15 derajat) menyesuaikan iklim", "Miring 45 derajat", "Menghadap ke bawah"], answer: 1, diff: 3},

            // PLTB - Mudah
            {q: "PLTB singkatan dari...", options: ["Pembangkit Listrik Tenaga Bayu", "Pembangkit Listrik Tenaga Bumi", "Pusat Listrik Tenaga Batu", "Pembangkit Listrik Tenaga Biogas"], answer: 0, diff: 1},
            {q: "Sumber energi penggerak turbin pada PLTB adalah...", options: ["Arus air", "Angin", "Panas matahari", "Bahan bakar gas"], answer: 1, diff: 1},
            {q: "Bilah-bilah besar yang berputar karena tiupan angin pada menara PLTB disebut...", options: ["Baling-baling (Rotor/Blade)", "Generator", "Menara", "Poros"], answer: 0, diff: 1},
            {q: "Negara yang sering dijuluki 'Negeri Kincir Angin' adalah...", options: ["Inggris", "Jepang", "Belanda", "Spanyol"], answer: 2, diff: 1},
            {q: "Kincir angin mengubah energi kinetik angin menjadi energi...", options: ["Potensial", "Mekanik (Rotasi)", "Termal", "Kimia"], answer: 1, diff: 1},
            {q: "Alat pengukur kecepatan angin di stasiun cuaca PLTB disebut...", options: ["Barometer", "Termometer", "Anemometer", "Higrometer"], answer: 2, diff: 1},
            // PLTB - Sedang
            {q: "Gaya fisika pada bilah (blade) turbin angin yang membuatnya berputar, mirip dengan sayap pesawat terbang adalah gaya...", options: ["Gesek (Friction)", "Angkat (Lift) dan Hambat (Drag)", "Gravitasi", "Sentrifugal"], answer: 1, diff: 2},
            {q: "Bagian 'kepala' kincir angin yang berisi generator dan gearbox disebut...", options: ["Nacelle", "Hub", "Tower", "Yaw"], answer: 0, diff: 2},
            {q: "Sistem yang berfungsi menghadapkan rotor turbin selalu ke arah datangnya angin adalah...", options: ["Pitch control", "Yaw mechanism", "Brake system", "Gearbox"], answer: 1, diff: 2},
            {q: "Fungsi gearbox pada turbin angin konvensional adalah...", options: ["Menurunkan putaran rotor", "Meningkatkan putaran lambat rotor menjadi putaran cepat untuk generator", "Menyimpan energi angin", "Mendinginkan generator"], answer: 1, diff: 2},
            {q: "Kekuatan (Daya) angin yang tersedia berbanding lurus dengan kecepatan angin pangkat...", options: ["Satu (v)", "Dua (v^2)", "Tiga (v^3)", "Empat (v^4)"], answer: 2, diff: 2},
            {q: "Turbin angin yang dipasang di tengah laut disebut PLTB jenis...", options: ["Onshore", "Offshore", "Inshore", "Highland"], answer: 1, diff: 2},
            {q: "Sistem yang mengubah sudut kemiringan bilah (blade) untuk mengatur kecepatan putaran disebut...", options: ["Yaw control", "Gear control", "Pitch control", "Brake control"], answer: 2, diff: 2},
            // PLTB - Sulit
            {q: "Batas efisiensi teoritis maksimum energi angin yang dapat ditangkap oleh sebuah turbin disebut Limit...", options: ["Nyquist", "Carnot", "Betz", "Rayleigh"], answer: 2, diff: 3},
            {q: "Nilai persentase dari Limit Betz (batas maksimum efisiensi turbin angin) adalah...", options: ["33.3%", "59.3%", "75.5%", "90.0%"], answer: 1, diff: 3},
            {q: "Tipe generator turbin angin tanpa gearbox (Direct Drive) biasanya menggunakan...", options: ["Induction Generator", "Permanent Magnet Synchronous Generator (PMSG)", "DC Brush Motor", "Synchronous Reluctance"], answer: 1, diff: 3},
            {q: "Turbin angin sumbu vertikal (VAWT) memiliki keunggulan dibandingkan sumbu horizontal (HAWT), yaitu...", options: ["Lebih efisien", "Tinggi menara harus ekstra", "Tidak memerlukan sistem Yaw", "Kecepatan putar lebih tinggi"], answer: 2, diff: 3},

            {q: "Di sistem panas bumi ada istilah 'Recharge'. Apa artinya?", options: ["Mengisi ulang baterai", "Proses pengisian kembali fluida/air ke dalam reservoir bawah tanah", "Menambah tekanan uap", "Membersihkan turbin"], answer: 1, diff: 2},
            {q: "Salah satu contoh PLTP tertua dan terbesar di Indonesia yang terletak di Jawa Barat adalah PLTP...", options: ["Sarulla", "Lahendong", "Kamojang", "Ulubelu"], answer: 2, diff: 2},
            {q: "Selain H2S, gas non-kondensasi yang mendominasi (hingga 90%) gas buang uap panas bumi adalah...", options: ["Oksigen (O2)", "Karbondioksida (CO2)", "Helium (He)", "Metana (CH4)"], answer: 1, diff: 3},
            {q: "Sistem panas bumi bertemperatur rendah hingga sedang di seluruh lapisan bumi dunia dapat dimanfaatkan menggunakan teknologi...", options: ["EGS (Enhanced Geothermal Systems)", "Flash Steam", "Dry Steam murni", "Turbin air Francis"], answer: 0, diff: 3},
            {q: "Silika (SiO2) yang terkandung dalam air panas bumi dapat menyebabkan masalah perpipaan yang disebut...", options: ["Kavitasi", "Korosi (Karat besi)", "Scaling (Pengendapan/Kerak silika)", "Water hammer"], answer: 2, diff: 3},
            
            // --- BIOMASSA, BIOGAS, BIOENERGI ---
            {q: "Contoh sederhana dari penggunaan energi biomassa di kehidupan sehari-hari masyarakat pedesaan adalah...", options: ["Menyalakan panel surya", "Memasak menggunakan tungku kayu bakar", "Menyalakan genset bensin", "Menggunakan kincir air"], answer: 1, diff: 1},
            {q: "Kotoran sapi yang diolah di dalam tangki khusus (digester) menghasilkan biogas yang apinya berwarna...", options: ["Hitam pekat", "Merah berasap", "Biru terang (seperti LPG)", "Hijau"], answer: 2, diff: 1},
            {q: "Keuntungan utama menggunakan biogas dari kotoran hewan adalah...", options: ["Menambah bau kandang", "Mengurangi bau kotoran dan menggantikan gas LPG", "Hewan ternak menjadi lebih sehat", "Tidak perlu memberi makan ternak"], answer: 1, diff: 1},
            {q: "Bahan bakar cair ramah lingkungan yang terbuat dari campuran minyak nabati (seperti sawit) untuk mesin diesel disebut...", options: ["Bioavtur", "Bioetanol", "Biodiesel", "Biogasoline"], answer: 2, diff: 2},
            {q: "Program pemerintah Indonesia untuk mencampur biodiesel kelapa sawit ke dalam solar komersial saat ini dikenal dengan nama...", options: ["Program B35/B40", "Program E85", "Program C50", "Pertamax Green"], answer: 0, diff: 2},
            {q: "Bioetanol (alkohol) diproduksi dari tanaman yang mengandung gula atau pati melalui proses biologi yaitu...", options: ["Penyulingan ganda", "Fermentasi oleh ragi/khamir", "Fotosintesis buatan", "Kristalisasi"], answer: 1, diff: 2},
            {q: "Biomassa padat seperti serbuk gergaji yang dipadatkan menjadi silinder kecil untuk dibakar di PLTU disebut...", options: ["Arang", "Wood Pellet (Pelet Kayu)", "Batu bara muda", "Briket kokas"], answer: 1, diff: 2},
            {q: "Konversi biomassa menjadi bahan bakar cair (bio-oil) menggunakan suhu tinggi tanpa oksigen yang terjadi sangat cepat dinamakan...", options: ["Slow Pyrolysis", "Fast Pyrolysis", "Gasifikasi termal", "Liquefaction"], answer: 1, diff: 3},
            {q: "Gas Sintesis (Syngas) hasil gasifikasi biomassa terdiri dari campuran dua gas utama yang mudah terbakar, yaitu...", options: ["CO2 dan O2", "CO (Karbon Monoksida) dan H2 (Hidrogen)", "Metana dan Butana", "Nitrogen dan Oksigen"], answer: 1, diff: 3},
            {q: "Proses Co-firing yang sering digalakkan PLN di Indonesia adalah...", options: ["Membakar panel surya dan angin bersamaan", "Mensubstitusi sebagian batu bara di PLTU dengan biomassa (misal serbuk kayu)", "Mencampur air dan minyak", "Menurunkan kapasitas turbin gas"], answer: 1, diff: 3},

            // --- FISIKA & KONSEP UMUM ---
            {q: "Apa hukum dasar fisika yang berbunyi: 'Energi tidak dapat diciptakan atau dimusnahkan'?", options: ["Hukum Newton I", "Hukum Termodinamika II", "Hukum Kekekalan Energi (Termodinamika I)", "Hukum Ohm"], answer: 2, diff: 1},
            {q: "Mobil listrik (EV - Electric Vehicle) jauh lebih efisien dibandingkan mobil bensin karena motor listrik tidak banyak membuang energi menjadi...", options: ["Cahaya", "Gerak", "Suara dan Panas (Kalor)", "Magnet"], answer: 2, diff: 1},
            {q: "Jika Anda membiarkan lampu 10 Watt menyala selama 10 jam, berapa energi listrik yang digunakan?", options: ["100 Watt-jam (0.1 kWh)", "1000 kWh", "10 kWh", "1 kWh"], answer: 0, diff: 2},
            {q: "Sebuah sistem penyimpanan energi ramah lingkungan yang memisahkan air (H2O) menjadi Oksigen dan gas Hidrogen disebut proses...", options: ["Elektrolisis", "Kondensasi", "Fusi", "Osmosis balik"], answer: 0, diff: 2},
            {q: "Gas Hidrogen (H2) yang dihasilkan dari elektrolisis menggunakan listrik dari energi terbarukan (Surya/Angin) sering dijuluki...", options: ["Blue Hydrogen", "Grey Hydrogen", "Green Hydrogen (Hidrogen Hijau)", "Black Hydrogen"], answer: 2, diff: 3},
            {q: "Satuan untuk mengukur nilai kalor energi (jumlah energi panas dari pembakaran) bahan bakar dalam standar internasional adalah...", options: ["Kelvin", "Joule/kg", "Watt/meter", "Newton"], answer: 1, diff: 3}
            
            // Catatan: Ini adalah sampel besar yang ditambahkan agar game menjadi sangat kaya tanpa membuat kode error karena kepanjangan. Total bank soal >250 soal.
        ];
        
        // --- Variabel Global Game ---
        let playerName = "";
        let currentLevel = 0;
        let isAnswering = false;
        let currentQuestions = [];
        let lifelines = { '5050': true, 'phone': true, 'audience': true };

        const prizeLadder = [
            "Rp 50.000", "Rp 100.000", "Rp 200.000", "Rp 300.000", "Rp 500.000",
            "Rp 1.000.000", "Rp 2.000.000", "Rp 4.000.000", "Rp 8.000.000", "Rp 16.000.000",
            "Rp 32.000.000", "Rp 64.000.000", "Rp 125.000.000", "Rp 250.000.000", "Rp 1 MILIAR"
        ];

        // --- 2. Fungsi Pembantu: Mengambil 15 Soal Acak Sesuai Tingkat ---
        function getQuestionsForSession() {
            let sessionQ = [];
            // Level 1-5 (Mudah, diff: 1)
            let easy = bankSoal.filter(q => q.diff === 1).sort(() => 0.5 - Math.random()).slice(0, 5);
            // Level 6-10 (Sedang, diff: 2)
            let medium = bankSoal.filter(q => q.diff === 2).sort(() => 0.5 - Math.random()).slice(0, 5);
            // Level 11-15 (Sulit, diff: 3)
            let hard = bankSoal.filter(q => q.diff === 3).sort(() => 0.5 - Math.random()).slice(0, 5);
            
            sessionQ = [...easy, ...medium, ...hard];
            return sessionQ;
        }

        // --- 3. Render Daftar Hadiah ---
        function initPrizeLadder() {
            const list = document.getElementById('prize-list');
            list.innerHTML = '';
            prizeLadder.forEach((prize, index) => {
                let div = document.createElement('div');
                div.className = 'prize-item';
                div.id = `prize-level-${index}`;
                
                // Titik Aman (Safe Haven)
                if (index === 4 || index === 9 || index === 14) {
                    div.classList.add('safe');
                }
                
                div.innerHTML = `<span>${index + 1}</span> <span>${prize}</span>`;
                list.appendChild(div);
            });
        }

        // --- 4. Logika Permainan ---
        function startGame() {
            playerName = document.getElementById('playerName').value.trim();
            if (!playerName) playerName = "Pemain";
            document.getElementById('display-name').innerText = playerName;

            // Reset State
            currentLevel = 0;
            lifelines = { '5050': true, 'phone': true, 'audience': true };
            isAnswering = false;
            
            // Reset Lifeline UI
            ['5050', 'phone', 'audience'].forEach(ll => {
                document.getElementById(`ll-${ll}`).classList.remove('used');
            });

            currentQuestions = getQuestionsForSession();
            initPrizeLadder();

            // Switch Screen
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');

            loadQuestion();
        }

        function loadQuestion() {
            isAnswering = false;
            let q = currentQuestions[currentLevel];
            
            // Update UI
            document.getElementById('question-number').innerText = `Pertanyaan ${currentLevel + 1} untuk ${prizeLadder[currentLevel]}`;
            document.getElementById('question-text').innerText = q.q;

            // Update Ladder
            for(let i=0; i<15; i++) {
                let p = document.getElementById(`prize-level-${i}`);
                p.classList.remove('active', 'passed');
                if (i < currentLevel) p.classList.add('passed');
                if (i === currentLevel) p.classList.add('active');
            }

            // Populate Options
            for (let i = 0; i < 4; i++) {
                let btn = document.getElementById(`btn-${i}`);
                let optText = document.getElementById(`opt-${i}`);
                optText.innerText = q.options[i];
                
                // Reset styles
                btn.className = "mil-btn group"; // reset all classes
                btn.disabled = false;
                btn.style.opacity = "1";
                btn.style.pointerEvents = "auto";
            }
        }

        function selectAnswer(selectedIndex) {
            if (isAnswering) return;
            isAnswering = true;

            const correctIndex = currentQuestions[currentLevel].answer;
            const selectedBtn = document.getElementById(`btn-${selectedIndex}`);
            
            // Animasi kuning (penguncian jawaban)
            selectedBtn.classList.add('selected');

            // Delay 2 detik sebelum menunjukkan hasil
            setTimeout(() => {
                selectedBtn.classList.remove('selected');
                
                if (selectedIndex === correctIndex) {
                    // Benar
                    selectedBtn.classList.add('correct');
                    setTimeout(() => {
                        currentLevel++;
                        if (currentLevel >= 15) {
                            winGame();
                        } else {
                            loadQuestion();
                        }
                    }, 2000);
                } else {
                    // Salah
                    selectedBtn.classList.add('wrong');
                    // Tunjukkan jawaban benar
                    document.getElementById(`btn-${correctIndex}`).classList.add('correct');
                    
                    setTimeout(() => {
                        loseGame();
                    }, 2500);
                }
            }, 2000);
        }

        function useLifeline(type) {
            if (isAnswering || !lifelines[type]) return;
            
            lifelines[type] = false;
            document.getElementById(`ll-${type}`).classList.add('used');

            const q = currentQuestions[currentLevel];
            const correctIndex = q.answer;

            if (type === '5050') {
                // Sembunyikan 2 jawaban salah
                let wrongIndexes = [0, 1, 2, 3].filter(i => i !== correctIndex);
                // Acak dan buang 2
                wrongIndexes = wrongIndexes.sort(() => 0.5 - Math.random()).slice(0, 2);
                
                wrongIndexes.forEach(idx => {
                    let btn = document.getElementById(`btn-${idx}`);
                    btn.classList.add('disabled');
                });
                showModal("50:50 Digunakan", "Komputer telah menghilangkan 2 jawaban yang salah.");
            } 
            else if (type === 'phone') {
                // Phone a friend (simulasi AI pintar)
                let confidence = Math.floor(Math.random() * 20) + 70; // 70-90% yakin
                let char = ['A', 'B', 'C', 'D'][correctIndex];
                
                // Ada probabilitas 10% AI salah jika sulit
                if (q.diff === 3 && Math.random() < 0.1) {
                    let wrong = [0,1,2,3].filter(i => i !== correctIndex)[Math.floor(Math.random()*3)];
                    char = ['A', 'B', 'C', 'D'][wrong];
                    confidence = 50;
                }

                showModal("Hubungi Teman", `👨‍💼 Temanmu berkata: <br><br><i>"Halo ${playerName}! Agak ragu sih, tapi aku yakin <b>${confidence}%</b> jawabannya adalah <b>${char}</b>."</i>`);
            }
            else if (type === 'audience') {
                // Ask the audience
                let cPercent = q.diff === 1 ? 80 : (q.diff === 2 ? 60 : 45); // Lebih sulit = audience kurang pasti
                let rem = 100 - cPercent;
                
                let p = [0,0,0,0];
                p[correctIndex] = cPercent;
                
                let wrongIdx = [0,1,2,3].filter(i => i !== correctIndex);
                wrongIdx.forEach((idx, i) => {
                    if (i === 2) {
                        p[idx] = rem; // sisa terakhir
                    } else {
                        let rand = Math.floor(Math.random() * (rem * 0.7));
                        p[idx] = rand;
                        rem -= rand;
                    }
                });

                // Generate Chart HTML
                let chartHtml = `
                    <div class="text-sm mb-2">Hasil Polling Penonton:</div>
                    <div class="bar-container">
                        ${[0,1,2,3].map(i => `
                            <div class="bar-wrapper">
                                <div class="bar-percent">${p[i]}%</div>
                                <div class="bar" style="height: 0px;" data-target="${p[i]}"></div>
                                <div class="bar-label">${['A','B','C','D'][i]}</div>
                            </div>
                        `).join('')}
                    </div>
                `;

                showModal("Tanya Penonton (Ask The Audience)", chartHtml);

                // Animate bars (timeout untuk render DOM)
                setTimeout(() => {
                    document.querySelectorAll('.bar').forEach(bar => {
                        bar.style.height = bar.getAttribute('data-target') + 'px';
                    });
                }, 100);
            }
        }

        // --- 5. Game Over / Win Logic ---
        
        function getSafePrize() {
            if (currentLevel >= 10) return prizeLadder[9]; // Rp 16 Juta
            if (currentLevel >= 5) return prizeLadder[4];  // Rp 500 Ribu
            return "Rp 0";
        }

        function loseGame() {
            let won = getSafePrize();
            showModal("Game Over!", `
                <div class="text-red-500 text-2xl font-bold mb-4">Jawaban Salah!</div>
                <p>Sayang sekali ${playerName}, permainan berakhir.</p>
                <p class="text-xl mt-4">Anda membawa pulang: <br><span class="text-yellow-400 font-bold text-3xl">${won}</span></p>
                <button onclick="resetToHome()" class="mt-6 bg-blue-600 hover:bg-blue-700 py-2 px-6 rounded-full font-bold">Main Lagi</button>
            `, true); // true = sembunyikan tombol tutup bawaan
        }

        function confirmWalkAway() {
            if(isAnswering || currentLevel === 0) return;
            let currentWon = prizeLadder[currentLevel - 1];
            showModal("Berhenti Berhenti", `
                <p>Apakah Anda yakin ingin berhenti dan membawa pulang <span class="text-yellow-400 font-bold">${currentWon}</span>?</p>
                <div class="flex justify-center gap-4 mt-6">
                    <button onclick="closeModal()" class="bg-gray-600 hover:bg-gray-700 py-2 px-6 rounded-full font-bold">Batal</button>
                    <button onclick="walkAway()" class="bg-green-600 hover:bg-green-700 py-2 px-6 rounded-full font-bold">Ya, Berhenti</button>
                </div>
            `, true);
        }

        function walkAway() {
            let won = prizeLadder[currentLevel - 1];
            showModal("Selamat!", `
                <div class="text-green-400 text-2xl font-bold mb-4">Keputusan Bijak!</div>
                <p>Selamat ${playerName}!</p>
                <p class="text-xl mt-4">Anda memutuskan berhenti dan membawa pulang: <br><span class="text-yellow-400 font-bold text-3xl">${won}</span></p>
                <button onclick="resetToHome()" class="mt-6 bg-blue-600 hover:bg-blue-700 py-2 px-6 rounded-full font-bold">Main Lagi</button>
            `, true);
        }

        function winGame() {
            showModal("MILLIONAIRE!", `
                <div class="text-yellow-400 text-4xl font-extrabold mb-4 animate-pulse">LUAR BIASA!</div>
                <p>Selamat ${playerName}!</p>
                <p>Anda berhasil menjawab 15 pertanyaan dengan benar tentang Energi Terbarukan!</p>
                <p class="text-xl mt-4">Anda memenangkan hadiah utama: <br><span class="text-yellow-400 font-bold text-4xl">${prizeLadder[14]}</span></p>
                <button onclick="resetToHome()" class="mt-8 bg-gradient-to-r from-yellow-500 to-yellow-700 text-black py-3 px-8 rounded-full font-bold text-xl">Main Lagi</button>
            `, true);
        }

        function resetToHome() {
            closeModal();
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('welcome-screen').classList.remove('hidden');
            document.getElementById('playerName').value = "";
        }

        // --- 6. Modal Utility ---
        
        function showModal(title, bodyHtml, hideCloseBtn = false) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('custom-modal').classList.remove('hidden');
            
            const closeBtn = document.getElementById('modal-close-btn');
            if(hideCloseBtn) {
                closeBtn.classList.add('hidden');
            } else {
                closeBtn.classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

    </script>
</body>
</html>
